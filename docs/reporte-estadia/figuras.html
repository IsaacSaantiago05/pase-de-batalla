function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e}
function mk(id,w,h){const d=document.createElement('div');d.className='fig';d.id=id;document.body.appendChild(d);
 const s=el('svg',{width:w,height:h,viewBox:`0 0 ${w} ${h}`});d.appendChild(s);
 const defs=el('defs',{},s);const m=el('marker',{id:'ar'+id,markerUnits:'userSpaceOnUse',markerWidth:11,markerHeight:9,refX:10,refY:4.5,orient:'auto'},defs);el('path',{d:'M0,0 L11,4.5 L0,9 z',fill:'#374151'},m);
 el('rect',{width:w,height:h,fill:'#fff'},s);s.mid='ar'+id;return s}
function box(s,x,y,w,h,fill,stroke,lines,o={}){el('rect',{x,y,width:w,height:h,rx:o.rx??8,fill,stroke,'stroke-width':o.sw??2,'stroke-dasharray':o.dash||''},s);
 const n=lines.length,lh=o.lh??20;let y0=y+h/2-((n-1)*lh)/2+5;
 lines.forEach((l,i)=>{const t=el('text',{x:x+w/2,y:y0+i*lh,'text-anchor':'middle',class:(i===0&&!o.flat)?'t':(i===0?'s':(o.small?'xs':'s'))},s);t.textContent=l});}
function arrow(s,x1,y1,x2,y2,o={}){el('line',{x1,y1,x2,y2,stroke:'#374151','stroke-width':o.w??2,'marker-end':`url(#${s.mid})`},s)}
function lab(s,x,y,txt,anchor='middle',cls='lab'){const t=el('text',{x,y,'text-anchor':anchor,class:cls},s);t.textContent=txt;return t}

// ---------- ER
function er(id,w,h,tables,rel,fs,lh){const s=mk(id,w,h);const lines=el('g',{},s),boxes=el('g',{},s);
 for(const t of Object.values(tables)){t.h=30+t.cols.length*lh+8}
 const c=t=>[t.x+t.w/2,t.y+t.h/2];
 const edge=(a,b)=>{const [ax,ay]=c(a),[bx,by]=c(b);const dx=bx-ax,dy=by-ay;const k=Math.min((a.w/2)/Math.abs(dx||1e-9),(a.h/2)/Math.abs(dy||1e-9));return [ax+dx*k,ay+dy*k]};
 for(const [a,b] of rel){const A=tables[a],B=tables[b];const p=edge(A,B),q=edge(B,A);el('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:'#6b7280','stroke-width':1.8},lines)}
 for(const [k,t] of Object.entries(tables)){
  el('rect',{x:t.x,y:t.y,width:t.w,height:t.h,rx:5,fill:'#fff',stroke:'#374151','stroke-width':1.8},boxes);
  el('rect',{x:t.x,y:t.y,width:t.w,height:26,rx:5,fill:'#1e3a8a'},boxes);
  const h=el('text',{x:t.x+t.w/2,y:t.y+18,'text-anchor':'middle','font-size':fs+1,'font-weight':'bold',style:'fill:#fff'},boxes);h.textContent=k;
  t.cols.forEach((cc,i)=>{const tx=el('text',{x:t.x+8,y:t.y+46+i*lh,'font-size':fs},boxes);tx.textContent=cc});}
}
